name: CI

# Manual only: nothing runs on push or pull request. Start it from the Actions tab
# ("Run workflow") when you want lint + tests, or the golden retrieval eval.
on:
  workflow_dispatch:
    inputs:
      run_retrieval_eval:
        description: "Run the golden retrieval eval against a live index (needs QDRANT_HOST / MODEL_SERVICE_URL secrets)"
        type: boolean
        default: false

jobs:
  unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System deps (SQLCipher)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlcipher-dev
      - name: Install (CPU torch first, then pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyflakes
          python -m spacy download de_core_news_sm
          python -m spacy download en_core_web_sm
      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes src frontend tests scripts/*.py
      - name: Unit tests (model-download tests excluded)
        env:
          DOCUMENT_STORE_ENABLED: "false"
          POSTGRES_PORT: "1"
          REDIS_PORT: "1"
          QDRANT_PORT: "1"
        run: |
          pytest tests/ -q --deselect tests/test_embedder.py --deselect tests/test_reranker.py \
            --cov=src --cov-report=term-missing:skip-covered
      - name: Offline migration check
        run: alembic upgrade head --sql > /dev/null

  retrieval-eval:
    name: Golden retrieval eval (manual, live index)
    if: github.event_name == 'workflow_dispatch' && inputs.run_retrieval_eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Evaluate
        env:
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_PORT: ${{ secrets.QDRANT_PORT }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          MODEL_SERVICE_URL: ${{ secrets.MODEL_SERVICE_URL }}
          DOCUMENT_STORE_ENABLED: "false"
        run: python scripts/eval_retrieval.py --min-recall 0.7 --json eval_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: eval_results.json
